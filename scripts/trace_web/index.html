<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청별 작업 대시보드</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="app-header">
<div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
<div><p class="eyebrow">AI WORKFLOW</p><h1>요청별 작업 대시보드</h1><p class="header-note">내 요청이 누구에게, 어떻게 전달됐는지 한눈에.</p></div>
<button id="refresh" class="refresh" type="button">↻ <span>새로고침</span></button>
</header>
<div class="layout">
<aside aria-label="요청 탐색">
<details id="request-browser" open>
<summary id="browser-label">요청 목록</summary>
<div class="nav-heading"><h2>내 요청</h2><span class="small">최신순</span></div>
<p id="list-state" role="status"></p><div id="list-actions"></div>
<nav id="requests" aria-label="기록 선택"></nav>
<p class="nav-note">접수 시각이 없는 요청은 아래에 최근 등록순으로 표시합니다.</p>
</details>
</aside>
<main id="main" tabindex="-1" aria-busy="false">
<div id="status" role="status">요청을 불러오는 중…</div>
<section id="summary" aria-label="요청 요약"></section>
<section id="metrics" aria-label="요청 사용량과 상태"></section>
<section id="workflow" aria-label="업무 분담 흐름"></section>
<section id="usage" aria-label="요청·역할·작업별 토큰 사용량"></section>
<details id="all-records" hidden>
<summary id="records-label">실제 명령과 전체 기록</summary>
<div class="details-content">
<section id="filters" aria-label="사건 필터">
<div><label for="role">역할</label><select id="role"><option value="">모든 역할</option></select></div>
<div><label for="kind">이벤트 종류</label><select id="kind"><option value="">모든 이벤트</option></select></div>
<div class="filter-count"><span id="event-count" role="status"></span><button id="reset" type="button">초기화</button></div>
</section>
<ol id="timeline" aria-label="원본 시각 순 기록"></ol>
</div>
</details>
<section id="metadata" aria-label="기록 근거"></section>
<footer>명시적으로 수입한 기록 · 읽기 전용</footer>
</main>
</div>
</body>
</html>
